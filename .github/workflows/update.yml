name: aggiornamento dati

on:
  schedule:
    - cron: "0 10 * * *"   # 12:00 ora italiana (est)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inverno CET - attendi 1 ora per le 12:00 italiane esatte
        run: |
          M=$(date -u +%m)
          if [ "$M" = "11" ] || [ "$M" = "12" ] || [ "$M" = "01" ] || [ "$M" = "02" ] || [ "$M" = "03" ]; then
            echo "inverno: aspetto 1 ora"
            sleep 3600
          fi
        timeout-minutes: 80
      - name: Raccoglie tutti i dati (nessuna chiave necessaria)
        run: node fetch.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "benchboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "dati aggiornati $(date -u +%Y-%m-%d)" && git push)
